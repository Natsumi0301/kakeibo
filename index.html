<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>家計簿</title>
<style>
  :root {
    --bar: #1e9e6a;
    --bar-dark: #178a5b;
    --bar-text: #ffffff;
    --bg: #f2f3f5;
    --card: #ffffff;
    --text: #222;
    --muted: #8e8e93;
    --line: #e6e6ea;
    --accent: #1e9e6a;
    --accent-soft: #e7f6ef;
    --red: #e5484d;
    --red-soft: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bar: #1a8a5d; --bar-dark: #157a52;
      --bg: #000; --card: #161618; --text: #f2f2f2; --muted: #8d8d93; --line: #2a2a2e;
      --accent: #3ec98c; --accent-soft: #163627; --red: #ff6b6b; --red-soft: #3a1f1f;
    }
  }
  :root[data-theme="dark"] {
      --bar: #1a8a5d; --bar-dark: #157a52;
      --bg: #000; --card: #161618; --text: #f2f2f2; --muted: #8d8d93; --line: #2a2a2e;
      --accent: #3ec98c; --accent-soft: #163627; --red: #ff6b6b; --red-soft: #3a1f1f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.45; font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  input, textarea { font: inherit; color: var(--text); font-size: 16px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- app bar ---------- */
  .appbar { background: var(--bar); color: var(--bar-text); position: sticky; top: 0; z-index: 5; }
  .appbar .inner { max-width: 640px; margin: 0 auto; }
  .appbar-top { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px; }
  .appbar-top .title { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .appbar-top button { color: var(--bar-text); font-size: 13px; padding: 6px 10px; border-radius: 6px; opacity: .92; min-width: 40px; }
  .appbar-top button:hover { background: rgba(255,255,255,.14); }
  .appbar-top button.gear { font-size: 18px; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 4px; }
  .month-nav button { color: var(--bar-text); width: 44px; height: 44px; font-size: 18px; opacity: .85; border-radius: 6px; }
  .month-nav button:hover { background: rgba(255,255,255,.14); opacity: 1; }
  .month-title { font-size: 16px; font-weight: 500; text-align: center; letter-spacing: .02em; }
  .month-range { font-size: 11px; opacity: .75; text-align: center; font-variant-numeric: tabular-nums; margin-top: -2px; }

  /* ---------- layout ---------- */
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 0 180px; }
  h2 {
    margin: 0; padding: 18px 16px 6px; font-size: 12px; font-weight: 500;
    color: var(--muted); letter-spacing: .04em; display: flex; justify-content: space-between; align-items: center;
  }
  h2 button { color: var(--accent); font-size: 13px; font-weight: 500; }
  .list { background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 16px; text-align: center; }

  /* ---------- rows ---------- */
  .card { border-bottom: 1px solid var(--line); }
  .card:last-child { border-bottom: none; }
  .card.dragging { opacity: .5; background: var(--accent-soft); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px 10px; cursor: pointer; user-select: none; }
  .row:active { background: var(--bg); }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .row-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 10px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; line-height: 16px; flex-shrink: 0; }
  .row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .row-sub b { font-weight: 500; color: var(--text); }
  .row-sub span { white-space: nowrap; margin-right: 10px; }
  .row-note { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-row { display: flex; align-items: flex-start; gap: 8px; background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 16px; }
  .note-label { font-size: 12px; color: var(--muted); padding-top: 4px; white-space: nowrap; }
  .note-row textarea { flex: 1; border: none; background: none; outline: none; resize: none; padding: 2px 4px; min-height: 24px; line-height: 1.4; font-size: 16px; border-radius: 4px; overflow: hidden; }
  .note-row textarea:focus { background: var(--bg); }
  .row-amt { text-align: right; flex-shrink: 0; }
  .row-amt .label { font-size: 10.5px; color: var(--muted); }
  .row-amt .value { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .row-amt .value.neg { color: var(--red); }
  .row-amt .value.pos { color: var(--accent); }
  .drag-handle { color: #c8c8cc; font-size: 18px; padding: 8px 6px 8px 0; margin: -8px 0 -8px -4px; cursor: grab; touch-action: none; user-select: none; line-height: 1; }
  .drag-handle:active { cursor: grabbing; }
  .bar { height: 2px; background: var(--line); margin: 0 16px 0; }
  .bar > div { height: 100%; background: var(--accent); transition: width .25s ease; }
  .bar > div.over { background: var(--red); }
  .card .bar { margin-bottom: 0; }

  /* ---------- details ---------- */
  .details { display: none; background: var(--bg); border-top: 1px solid var(--line); }
  .card.open .details { display: block; }
  .items { list-style: none; margin: 0; padding: 0; }
  .items li { display: flex; align-items: center; gap: 8px; padding: 9px 16px 9px 28px; border-bottom: 1px solid var(--line); font-size: 14px; background: var(--card); }
  .items li { flex-wrap: wrap; }
  .items li .item-opts { flex-basis: 100%; display: flex; align-items: center; gap: 4px; padding-left: 4px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .items li .item-opts label { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .items li .item-opts label:hover { background: var(--bg); }
  .items li .item-opts input[type=checkbox] { margin: 0; width: 14px; height: 14px; accent-color: var(--accent); }
  .items li .item-opts .pay input[type=number] { width: 5.5em; border: none; border-bottom: 1px solid #d5d5d9; background: none; padding: 1px 4px; text-align: right; font-variant-numeric: tabular-nums; font-size: 16px; outline: none; border-radius: 0; }
  .items li .item-opts .pay input:focus { border-color: var(--accent); }
  .items li .item-opts .pay input::placeholder { color: #c0c0c4; font-size: 12px; }
  .items li .item-opts button { margin-left: auto; padding: 4px 8px; border-radius: 6px; color: var(--muted); font-size: 12px; }
  .items li .item-opts button:hover { background: var(--bg); color: var(--text); }
  .items li input { border: none; background: none; outline: none; padding: 2px 4px; border-radius: 4px; min-width: 0; }
  .items li input:focus { background: var(--bg); }
  .items li .iname { flex: 1; }
  .items li .yen { color: var(--muted); font-size: 13px; margin-right: -6px; }
  .items li .iamt { width: 6.5em; text-align: right; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  .items li .iamt::-webkit-inner-spin-button, .items li .iamt::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .items li button.link { color: #c8c8cc; font-size: 16px; padding: 0 0 0 8px; line-height: 1; }
  .items li button.link:hover { color: var(--red); }
  .items li.empty { color: var(--muted); font-size: 12.5px; padding: 9px 16px 9px 28px; text-align: left; }
  .add-row { display: flex; gap: 0; background: var(--card); border-bottom: 1px solid var(--line); padding-left: 16px; }
  .add-row input { border: none; background: none; padding: 10px 8px; outline: none; min-width: 0; font-size: 16px; }
  .add-row input.iname { flex: 1; }
  .add-row input.iamt { width: 7.5em; text-align: right; font-variant-numeric: tabular-nums; }
  .add-row button { color: var(--accent); font-weight: 500; padding: 0 16px; font-size: 14px; }
  .add-row input::placeholder { color: #b5b5ba; }
  .tools { display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 16px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .tools .sp { flex: 1; }
  .tools .note { padding: 6px 8px; font-size: 12.5px; color: var(--muted); }
  .confirm-row { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; font-size: 13.5px; cursor: pointer; flex-wrap: wrap; }
  .confirm-row input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .confirm-row small { flex-basis: 100%; padding-left: 24px; color: var(--muted); font-size: 11.5px; }
  .summary .inner.final { grid-template-columns: 1fr 1fr; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 6px; }
  .summary .inner.final:not(.confirmed) { grid-template-columns: 1fr; }
  .summary .inner.final .value { font-size: 18px; }
  .tools .pay { display: inline-flex; align-items: center; gap: 4px; }
  .tools .pay input[type=number] { width: 6.5em; border: none; border-bottom: 1px solid #c8c8cc; background: none; padding: 2px 4px; text-align: right; font-variant-numeric: tabular-nums; font-size: 16px; outline: none; }
  .tools .pay input[type=number]:focus { border-color: var(--accent); }
  .tools .pay input::placeholder { color: #c0c0c4; font-size: 13px; }
  .modal label.cost { gap: 8px; }
  .modal label.cost select { font: inherit; font-size: 13px; color: var(--muted); border: none; background: none; outline: none; }
  .modal label.cost input.cname { text-align: left; flex: 1.4; }
  .modal label.cost .cycle { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .modal label.cost input.camt { flex: 1; }
  .modal label.cost button { color: #c8c8cc; font-size: 18px; padding: 0 4px; }
  .modal label.cost button:hover { color: var(--red); }
  .tools button, .tools label { display: inline-flex; align-items: center; gap: 5px; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .tools button:hover, .tools label:hover { background: var(--line); color: var(--text); }
  .tools button:disabled { opacity: .3; cursor: default; background: none; }
  .tools button.danger:hover { color: var(--red); background: var(--red-soft); }
  .tools input[type=checkbox] { margin: 0; width: 14px; height: 14px; accent-color: var(--accent); }
  .tools .edit-budget { display: inline-flex; align-items: center; gap: 4px; }
  .tools .edit-budget input { width: 6.5em; border: none; border-bottom: 1px solid #c8c8cc; background: none; padding: 2px 4px; text-align: right; font-variant-numeric: tabular-nums; font-size: 16px; outline: none; }
  .tools .edit-budget input:focus { border-color: var(--accent); }

  /* ---------- summary ---------- */
  .summary {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .summary .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  .summary .stat { text-align: center; padding: 2px 4px; border-left: 1px solid var(--line); min-width: 0; overflow: hidden; }
  .summary .stat:first-child { border-left: none; }
  .summary .label { font-size: 10.5px; color: var(--muted); line-height: 1.2; }
  .summary .value { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .summary .value.neg { color: var(--red); }
  .summary .value.pos { color: var(--accent); }
  @media (max-width: 430px) { .summary .value { font-size: 13px; } .summary .label { font-size: 9.5px; } .summary .stat { padding: 2px 2px; } }

  /* ---------- modal ---------- */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
  .modal-bg.show { display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 560px) { .modal-bg.show { align-items: center; padding: 16px; } }
  .modal {
    background: var(--card); width: 100%; max-width: 420px; max-height: 90vh; overflow: auto;
    border-radius: 14px 14px 0 0; padding: 8px 0 calc(12px + env(safe-area-inset-bottom));
    animation: up .18s ease-out;
  }
  @media (min-width: 560px) { .modal { border-radius: 14px; } }
  @keyframes up { from { transform: translateY(16px); opacity: 0; } }
  .modal h3 { margin: 0; padding: 12px 16px; font-size: 15px; font-weight: 600; text-align: center; }
  .modal label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; height: 46px; border-top: 1px solid var(--line); font-size: 14px; }
  .modal label:last-of-type { border-bottom: 1px solid var(--line); }
  .modal label span { color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .modal label input { border: none; background: none; outline: none; text-align: right; flex: 1; min-width: 0; width: 100%; font-size: 16px; font-variant-numeric: tabular-nums; }
  .modal { overflow-x: hidden; }
  .modal label input::placeholder { color: #b5b5ba; }
  .modal textarea { display: block; width: calc(100% - 32px); margin: 0 16px; height: 90px; font: 16px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); resize: vertical; outline: none; }
  .modal .row { display: flex; gap: 8px; padding: 14px 16px 4px; }
  .modal .row button { flex: 1; height: 42px; border-radius: 10px; font-weight: 500; font-size: 15px; background: var(--bg); color: var(--text); }
  .modal .row button.primary { background: var(--bar); color: #fff; }
  .modal .row button.primary:hover { background: var(--bar-dark); }
  .modal hr { border: none; border-top: 8px solid var(--bg); margin: 16px 0 0; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; padding: 0 16px 10px; }
</style>
</head>
<body>
<header class="appbar">
  <div class="inner">
    <div class="appbar-top">
      <button id="todayBtn">今月</button>
      <span class="title">家計簿</span>
      <button class="gear" id="settingsBtn" title="設定">⚙</button>
    </div>
    <div class="month-nav">
      <button id="prevMonth" title="前月">‹</button>
      <div>
        <div class="month-title" id="monthTitle"></div>
        <div class="month-range" id="monthRange"></div>
      </div>
      <button id="nextMonth" title="次月">›</button>
    </div>
  </div>
</header>

<div class="wrap">
  <label class="confirm-row"><input type="checkbox" id="confirmMonth"><span>この月を確定する</span><small>固定枠の余りを引いた最終金額（実質）を出します</small></label>
  <h2><span>イベント・その他</span><button id="addEventBtn">＋ 追加</button></h2>
  <div class="list" id="eventList"></div>

  <h2><span>固定枠</span></h2>
  <div class="list" id="fixedList"></div>

  <h2><span>固定費</span></h2>
  <div class="list" id="costList"></div>
</div>

<div class="summary">
  <div class="inner">
    <div class="stat"><div class="label">予算</div><div class="value" id="sumBudget"></div></div>
    <div class="stat"><div class="label">使った額</div><div class="value" id="sumSpent"></div></div>
    <div class="stat"><div class="label">終了分の差分<span id="doneCount"></span></div><div class="value" id="doneDiff"></div></div>
    <div class="stat"><div class="label">差分込みの予算</div><div class="value" id="sumAdjusted"></div></div>
  </div>
  <div class="inner final" id="finalRow">
    <div class="stat"><div class="label">カード支払い</div><div class="value" id="sumCard"></div></div>
    <div class="stat" id="finalStat" hidden><div class="label">最終金額（実質）</div><div class="value" id="sumFinal"></div></div>
  </div>
</div>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>固定枠の毎月予算</h3>
    <div id="fixedBudgetInputs"></div>
    <h3>固定費（家賃・サブスクなど）</h3>
    <div id="fixedCostInputs"></div>
    <div class="row"><button id="addCostBtn">＋ 毎月の固定費</button><button id="addYearCostBtn">＋ 年1回の固定費</button></div>
    <p class="hint">変更は今月以降に反映されます。過去の月は各月の画面で直接編集できます。</p>
    <div class="row"><button id="closeSettings">閉じる</button><button class="primary" id="saveSettings">保存</button></div>
    <hr>
    <h3>データの引き継ぎ</h3>
    <p class="hint">別のブラウザや端末に移すときは、書き出したテキストをコピーして、移行先で貼り付けて読み込んでください。</p>
    <textarea id="exportArea"></textarea>
    <div class="row">
      <button id="exportBtn">書き出す</button>
      <button id="importBtn">読み込む（上書き）</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="eventModal">
  <div class="modal">
    <h3>項目を追加</h3>
    <label><span>名前</span><input type="text" id="evName" placeholder="例：千葉ライブ"></label>
    <label><span>予算</span><input type="number" id="evBudget" min="0" placeholder="10000"></label>
    <div class="row"><button id="closeEvent">キャンセル</button><button class="primary" id="saveEvent">追加</button></div>
  </div>
</div>

<script>
(() => {
  const KEY = 'kakeibo-v1';
  const FIXED = ['交通費', '食費', '生活費'];
  const START_DAY = 12;

  // ---------- state ----------
  let state = load();
  let currentKey = monthKeyOf(new Date());
  const openCards = new Set();

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.months) return s;
    } catch (e) {}
    return { fixedBudgets: { 交通費: 0, 食費: 0, 生活費: 0 }, fixedCosts: [], months: {} };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- month helpers ----------
  function monthKeyOf(d) {
    let y = d.getFullYear(), m = d.getMonth();
    if (d.getDate() < START_DAY) { m--; if (m < 0) { m = 11; y--; } }
    return `${y}-${String(m + 1).padStart(2, '0')}`;
  }
  function shiftKey(key, delta) {
    let [y, m] = key.split('-').map(Number);
    m += delta - 1;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return `${y}-${String(m + 1).padStart(2, '0')}`;
  }
  // 各月は作成時点の設定（固定枠の予算・固定費）を自分の中に持つ。
  // 設定を変えても過去の月は変わらず、各月の画面で個別に直せる。
  function monthData(key) {
    if (!state.fixedCosts) state.fixedCosts = [];
    if (!state.months[key]) {
      state.months[key] = { fixed: {}, events: [], budgets: {}, costs: [] };
      applySettingsTo(state.months[key], key);
    }
    const md = state.months[key];
    FIXED.forEach(f => { if (!md.fixed[f]) md.fixed[f] = []; });
    if (!md.budgets) md.budgets = { ...state.fixedBudgets };
    if (!md.costs) md.costs = state.fixedCosts.map(c => ({ ...c, items: [] }));
    if (!md.fixedPay) md.fixedPay = {};
    FIXED.forEach(f => { if (!md.fixedPay[f]) md.fixedPay[f] = { card: null, paid: false }; });
    return md;
  }
  // 設定内容をその月にコピーする（固定費の内訳メモは残す）
  function applySettingsTo(md, key) {
    // その月で直接編集した値は設定を保存し直しても上書きしない
    const editedB = md.editedBudgets || {};
    const oldB = md.budgets || {};
    md.budgets = { ...state.fixedBudgets };
    FIXED.forEach(f => { if (editedB[f]) md.budgets[f] = oldB[f]; });
    const old = md.costs || [];
    const removed = md.removedCosts || [];   // この月から外した固定費は戻さない
    const m = Number((key || '').split('-')[1]);  // 年1回の固定費は該当月だけ
    md.costs = state.fixedCosts
      .filter(c => !removed.includes(c.id))
      .filter(c => c.cycle !== 'year' || !m || Number(c.month) === m)
      .map(c => {
        const prev = old.find(o => o.id === c.id);
        return { id: c.id, name: c.name, amount: prev && prev.edited ? prev.amount : c.amount,
          edited: !!(prev && prev.edited), items: prev ? prev.items : [], note: prev ? prev.note : '',
          card: prev ? prev.card : null, paid: !!(prev && prev.paid) };
      });
  }

  const m0 = key => Number(key.split('-')[1]);

  // ---------- utils ----------
  const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
  const sum = items => items.reduce((a, b) => a + (Number(b.amount) || 0), 0);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // ---------- render ----------
  function render() {
    const md = monthData(currentKey);
    const [y, m] = currentKey.split('-').map(Number);
    const nextK = shiftKey(currentKey, 1);
    const [ny, nm] = nextK.split('-').map(Number);
    document.getElementById('monthTitle').textContent = `${y}年${m}月`;
    document.getElementById('monthRange').textContent = `${m}/${START_DAY} 〜 ${nm}/${START_DAY - 1}`;

    // fixed
    let totalBudget = 0, totalSpent = 0, fixedLeft = 0, cardTotal = 0;
    // カード支払い額: 入力があればそれ、なければ実際の額。支払い済みなら数えない
    const cardOf = (pay, actual) => pay.paid ? 0 : (pay.card === null || pay.card === undefined || pay.card === '' ? actual : Number(pay.card) || 0);
    const fixedHtml = FIXED.map(f => {
      const budget = Number(md.budgets[f]) || 0;
      const items = md.fixed[f];
      const spent = sum(items);
      totalBudget += budget; totalSpent += spent; fixedLeft += budget - spent;
      items.forEach(it => { cardTotal += cardOf(it, Number(it.amount) || 0); });
      return cardHtml({ id: 'fixed:' + f, name: f, budget, spent, items, kind: 'fixed', pay: md.fixedPay[f] });
    }).join('');
    document.getElementById('fixedList').innerHTML = fixedHtml;

    // fixed costs: 最初から使った扱い。内訳はメモで計算に使わない
    const costHtml = md.costs.map(c => {
      const amount = Number(c.amount) || 0;
      totalBudget += amount; totalSpent += amount;
      cardTotal += cardOf(c, amount);
      return cardHtml({ id: 'cost:' + c.id, name: c.name, budget: amount, spent: amount, items: c.items, kind: 'cost', note: c.note, pay: c });
    }).join('');
    document.getElementById('costList').innerHTML = costHtml || '<div class="empty">固定費は ⚙ 設定から登録できます。</div>';

    // events
    let doneDiff = 0, doneCount = 0;
    const evHtml = md.events.map((ev, idx) => {
      const budget = Number(ev.budget) || 0;
      const spent = spentOf(ev, budget);
      totalBudget += budget; totalSpent += spent;
      const done = isDone(ev);
      if (done) { doneDiff += budget - spent; doneCount++; }
      if (ev.items.length) ev.items.forEach(it => { cardTotal += cardOf(it, Number(it.amount) || 0); });
      else cardTotal += cardOf(ev, spent);
      return cardHtml({ id: 'event:' + ev.id, name: ev.name, budget, spent, items: ev.items, kind: 'event',
        done, checked: !!ev.done, noSpend: !!ev.noSpend, hasItems: ev.items.length > 0, first: idx === 0, last: idx === md.events.length - 1, note: ev.note, pay: ev });
    }).join('');
    document.getElementById('eventList').innerHTML = evHtml || '<div class="empty">この月の項目はまだありません。＋ から追加できます。</div>';
    const dd = document.getElementById('doneDiff');
    dd.textContent = (doneDiff < 0 ? '-' : (doneDiff === 0 ? '' : '+')) + yen(Math.abs(doneDiff));
    dd.className = 'value ' + (doneDiff < 0 ? 'neg' : 'pos');
    document.getElementById('doneCount').textContent = ` ${doneCount}件`;

    // summary: 終了したイベントは予算の代わりに実際に使った額で数えた合計
    //   = 予算合計 - 終了分の差分（超過ならその分増え、余ればその分減る）
    const adjusted = totalBudget - doneDiff;
    document.getElementById('sumBudget').textContent = yen(totalBudget);
    document.getElementById('sumSpent').textContent = yen(totalSpent);
    const sa = document.getElementById('sumAdjusted');
    sa.textContent = (adjusted < 0 ? '-' : '') + yen(Math.abs(adjusted));
    sa.className = 'value ' + (adjusted > totalBudget ? 'neg' : (adjusted < totalBudget ? 'pos' : ''));

    // 確定: 固定枠の余りを引いた最終金額（実質）と、カード支払い額
    const confirmed = !!md.confirmed;
    document.getElementById('confirmMonth').checked = confirmed;
    document.getElementById('finalStat').hidden = !confirmed;
    document.getElementById('finalRow').classList.toggle('confirmed', confirmed);
    const finalAmt = adjusted - fixedLeft;
    document.getElementById('sumFinal').textContent = (finalAmt < 0 ? '-' : '') + yen(Math.abs(finalAmt));
    document.getElementById('sumCard').textContent = yen(cardTotal);

    bindCards();
  }

  // 内訳があればその合計が「使った額」。内訳なしの場合は
  //   「終了」チェック → 予算どおり使ったとみなす／「出費なし」チェック → 0円
  const isDone = ev => ev.items.length > 0 || !!ev.done || !!ev.noSpend;
  const spentOf = (ev, budget) => ev.items.length > 0 ? sum(ev.items) : (ev.done ? budget : 0);

  function cardHtml({ id, name, budget, spent, items, kind, done, checked, noSpend, hasItems, first, last, note, pay }) {
    const payHtml = `<span class="pay" title="カードで払う額が実際と違うときだけ入力（空欄なら実際の額）">カード <input type="number" min="0" placeholder="実額" value="${pay && pay.card !== null && pay.card !== undefined ? pay.card : ''}" data-card-amt></span>
            <label title="支払い済みならカード支払いに数えません"><input type="checkbox" data-paid ${pay && pay.paid ? 'checked' : ''}> 支払い済</label>`;
    const diff = budget - spent;
    const isFixed = kind === 'fixed', isCost = kind === 'cost', isEvent = kind === 'event';
    const label = isCost ? '固定費' : (isFixed ? '残り' : '差分');
    const diffText = isCost ? yen(budget) : (diff < 0 ? '-' : (isFixed || diff === 0 ? '' : '+')) + yen(Math.abs(diff));
    const diffCls = isCost ? '' : (diff < 0 ? 'neg' : (isFixed ? '' : 'pos'));
    const pct = budget > 0 ? Math.min(100, spent / budget * 100) : (spent > 0 ? 100 : 0);
    const over = budget > 0 ? spent > budget : spent > 0;
    const open = openCards.has(id) ? 'open' : '';
    const itemsHtml = items.length
      ? items.map((it, i) => `<li>
          <input class="iname" value="${esc(it.name)}" data-edit-name="${i}" placeholder="内訳">
          <span class="yen">¥</span><input class="iamt" type="number" min="0" value="${Number(it.amount) || 0}" data-edit-amt="${i}">
          <button class="link" data-del-item="${i}" title="削除">×</button>
          ${kind === 'cost' ? '' : `<div class="item-opts">
            <span class="pay" title="カードで払う額が実際と違うときだけ入力（空欄なら実額）">カード <input type="number" min="0" placeholder="実額" value="${it.card !== null && it.card !== undefined ? it.card : ''}" data-item-card="${i}"></span>
            <label title="支払い済みならカード支払いに数えません"><input type="checkbox" data-item-paid="${i}" ${it.paid ? 'checked' : ''}> 支払い済</label>
            <button type="button" data-item-slide="${i}" title="この内訳だけ翌月に回す">翌月へ →</button>
          </div>`}</li>`).join('')
      : '<li class="empty">内訳なし</li>';
    return `
      <div class="card ${open}" data-card="${esc(id)}">
        <div class="row" data-toggle>
          ${isEvent ? '<span class="drag-handle" data-drag title="ドラッグで並べ替え">≡</span>' : ''}
          <div class="row-main">
            <div class="row-name"><span>${esc(name)}</span>${done ? '<span class="badge">済</span>' : ''}</div>
            <div class="row-sub">${isCost ? '<span>毎月かかる固定の支出</span>' : `<span>予算 <b>${yen(budget)}</b></span> <span>使った額 <b>${yen(spent)}</b></span>`}</div>
            ${note ? `<div class="row-note">${esc(note)}</div>` : ''}
          </div>
          <div class="row-amt"><div class="label">${label}</div><div class="value ${diffCls}">${diffText}</div></div>
        </div>
        ${isCost ? '' : `<div class="bar"><div class="${over ? 'over' : ''}" style="width:${pct}%"></div></div>`}
        <div class="details">
          ${isCost ? '<div class="tools"><span class="note">内訳はメモ用で、金額の計算には使いません</span></div>' : ''}
          <ul class="items">${itemsHtml}</ul>
          <form class="add-row" data-add-item>
            <input class="iname" placeholder="内訳（空欄なら「${esc(name)}」）" title="空欄のまま追加すると「${esc(name)}」になります">
            <input class="iamt" type="number" min="0" placeholder="金額" required>
            <button type="submit">追加</button>
          </form>
          ${isFixed ? '' : `<div class="note-row"><span class="note-label">備考</span><textarea rows="1" data-note placeholder="メモを書く（日程、同行者、注意点など）">${esc(note || '')}</textarea></div>`}
          ${isFixed ? `<div class="tools"><span class="edit-budget">この月の予算 <input type="number" min="0" value="${budget}" data-budget></span></div>` : ''}
          ${isCost ? `<div class="tools"><span class="edit-budget">この月の金額 <input type="number" min="0" value="${budget}" data-budget></span><span class="sp"></span>${payHtml}<button type="button" data-slide title="支払いを翌月に回す">翌月へ →</button><button type="button" class="danger" data-del-cost-row>この月から削除</button></div>` : ''}
          ${isEvent ? `<div class="tools">
            ${hasItems ? '<span class="note">内訳の合計で計算</span>' : `
            <label title="予算どおり使ったとして計算します"><input type="checkbox" data-done ${checked ? 'checked' : ''}> 終了</label>
            <label title="使わなかったとして計算します"><input type="checkbox" data-nospend ${noSpend ? 'checked' : ''}> 出費なし</label>`}
            <span class="edit-budget">予算 <input type="number" min="0" value="${budget}" data-budget></span>
            <span class="sp"></span>
            ${hasItems ? '' : payHtml}
            <button type="button" data-slide title="項目ごと翌月に回す">翌月へ →</button>
            <button type="button" data-move="-1" title="上へ" ${first ? 'disabled' : ''}>▲</button>
            <button type="button" data-move="1" title="下へ" ${last ? 'disabled' : ''}>▼</button>
            <button type="button" class="danger" data-del-event>削除</button>
          </div>` : ''}
        </div>
      </div>`;
  }

  function resolve(cardEl) {
    const id = cardEl.dataset.card;
    const md = monthData(currentKey);
    if (id.startsWith('fixed:')) {
      const f = id.slice(6);
      return { items: md.fixed[f], fixedKey: f };
    }
    if (id.startsWith('cost:')) {
      const c = md.costs.find(x => x.id === id.slice(5));
      return { items: c.items, ev: c };
    }
    const ev = md.events.find(e => e.id === id.slice(6));
    return { items: ev.items, ev };
  }

  function bindCards() {
    document.querySelectorAll('.card').forEach(card => {
      const id = card.dataset.card;
      card.querySelector('[data-toggle]').addEventListener('click', e => {
        if (e.target.closest('button, label, input, [data-drag]')) return;
        card.classList.toggle('open');
        if (card.classList.contains('open')) openCards.add(id); else openCards.delete(id);
        card.querySelectorAll('[data-note]').forEach(t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; });
      });
      card.querySelector('[data-add-item]').addEventListener('submit', e => {
        e.preventDefault();
        const nameEl = e.target.querySelector('.iname'), amtEl = e.target.querySelector('.iamt');
        const name = nameEl.value.trim() || card.querySelector('.row-name > span').textContent, amount = Number(amtEl.value);
        if (!(amount >= 0)) return;
        resolve(card).items.push({ name, amount });
        openCards.add(id);
        save(); render();
        const c = document.querySelector(`[data-card="${CSS.escape(id)}"] .iname`);
        if (c) c.focus();
      });
      card.querySelectorAll('[data-edit-name]').forEach(inp => inp.addEventListener('change', () => {
        const it = resolve(card).items[Number(inp.dataset.editName)];
        it.name = inp.value.trim() || card.querySelector('.row-name > span').textContent;
        save(); render();
      }));
      card.querySelectorAll('[data-edit-amt]').forEach(inp => inp.addEventListener('change', () => {
        resolve(card).items[Number(inp.dataset.editAmt)].amount = Number(inp.value) || 0;
        save(); render();
      }));
      const noteEl = card.querySelector('[data-note]');
      if (noteEl) {
        const grow = () => { noteEl.style.height = 'auto'; noteEl.style.height = noteEl.scrollHeight + 'px'; };
        grow();
        noteEl.addEventListener('input', grow);
        noteEl.addEventListener('change', () => { resolve(card).ev.note = noteEl.value.trim(); save(); render(); });
      }
      card.querySelectorAll('[data-item-card]').forEach(inp => inp.addEventListener('change', () => {
        const it = resolve(card).items[Number(inp.dataset.itemCard)];
        it.card = inp.value === '' ? null : (Number(inp.value) || 0);
        save(); render();
      }));
      card.querySelectorAll('[data-item-paid]').forEach(cb => cb.addEventListener('change', () => {
        resolve(card).items[Number(cb.dataset.itemPaid)].paid = cb.checked;
        save(); render();
      }));
      // 内訳1件だけ翌月へ（カードの支払い月ズレ用）
      card.querySelectorAll('[data-item-slide]').forEach(btn => btn.addEventListener('click', () => {
        const r = resolve(card), idx = Number(btn.dataset.itemSlide), it = r.items[idx];
        const nextKey = shiftKey(currentKey, 1);
        const [ny, nm] = nextKey.split('-').map(Number);
        if (!confirm(`「${it.name}」(${yen(it.amount)}) を ${ny}年${nm}月 に移しますか？`)) return;
        const nd = monthData(nextKey);
        r.items.splice(idx, 1);
        if (r.fixedKey) {
          nd.fixed[r.fixedKey].push(it);
        } else {
          // 翌月に同名の項目（○月分）を作ってそこへ。予算は移した分だけ持たせて差分に影響させない
          const label = r.ev.name + '（' + m0(currentKey) + '月分）';
          let target = nd.events.find(e => e.name === label);
          if (!target) { target = { id: uid(), name: label, budget: 0, items: [], note: '' }; nd.events.push(target); }
          target.items.push(it);
          target.budget = (Number(target.budget) || 0) + (Number(it.amount) || 0);
        }
        save(); render();
      }));
      card.querySelectorAll('[data-del-item]').forEach(btn => btn.addEventListener('click', () => {
        resolve(card).items.splice(Number(btn.dataset.delItem), 1);
        save(); render();
      }));
      const delCost = card.querySelector('[data-del-cost-row]');
      if (delCost) delCost.addEventListener('click', () => {
        const { ev } = resolve(card);
        if (!confirm(`「${ev.name}」をこの月から外しますか？
（設定に残っているので、他の月には影響しません）`)) return;
        const md = monthData(currentKey);
        md.costs = md.costs.filter(c => c !== ev);
        (md.removedCosts = md.removedCosts || []).push(ev.id);
        openCards.delete(id);
        save(); render();
      });
      const delEv = card.querySelector('[data-del-event]');
      if (delEv) delEv.addEventListener('click', () => {
        const { ev } = resolve(card);
        if (!confirm(`「${ev.name}」を削除しますか？（内訳も消えます）`)) return;
        const md = monthData(currentKey);
        md.events = md.events.filter(e => e !== ev);
        openCards.delete(id);
        save(); render();
      });
      const doneCb = card.querySelector('[data-done]');
      if (doneCb) doneCb.addEventListener('change', () => {
        const { ev } = resolve(card);
        ev.done = doneCb.checked; if (ev.done) ev.noSpend = false;
        save(); render();
      });
      const noSpendCb = card.querySelector('[data-nospend]');
      if (noSpendCb) noSpendCb.addEventListener('change', () => {
        const { ev } = resolve(card);
        ev.noSpend = noSpendCb.checked; if (ev.noSpend) ev.done = false;
        save(); render();
      });
      card.querySelectorAll('[data-move]').forEach(btn => btn.addEventListener('click', () => {
        const md = monthData(currentKey);
        const { ev } = resolve(card);
        const i = md.events.indexOf(ev), j = i + Number(btn.dataset.move);
        if (j < 0 || j >= md.events.length) return;
        [md.events[i], md.events[j]] = [md.events[j], md.events[i]];
        save(); render();
      }));
      const handle = card.querySelector('[data-drag]');
      if (handle) handle.addEventListener('pointerdown', e => {
        e.preventDefault();
        handle.setPointerCapture(e.pointerId);
        card.classList.add('dragging');
        const list = document.getElementById('eventList');
        const onMove = ev => {
          const others = [...list.querySelectorAll('.card')].filter(c => c !== card);
          const next = others.find(c => { const r = c.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
          if (next) list.insertBefore(card, next); else list.appendChild(card);
        };
        const onUp = () => {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
          card.classList.remove('dragging');
          const md = monthData(currentKey);
          const order = [...list.querySelectorAll('.card')].map(c => c.dataset.card.slice(6));
          md.events.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
          save(); render();
        };
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      });
      const bud = card.querySelector('[data-budget]');
      if (bud) bud.addEventListener('change', () => {
        const r = resolve(card), v = Number(bud.value) || 0, md = monthData(currentKey);
        if (r.fixedKey) { md.budgets[r.fixedKey] = v; (md.editedBudgets = md.editedBudgets || {})[r.fixedKey] = true; }
        else if (card.dataset.card.startsWith('cost:')) { r.ev.amount = v; r.ev.edited = true; }
        else r.ev.budget = v;
        save(); render();
      });
      // カード支払い額・支払い済み
      const payOf = () => { const r = resolve(card); return r.fixedKey ? monthData(currentKey).fixedPay[r.fixedKey] : r.ev; };
      const cardAmt = card.querySelector('[data-card-amt]');
      if (cardAmt) cardAmt.addEventListener('change', () => {
        payOf().card = cardAmt.value === '' ? null : (Number(cardAmt.value) || 0);
        save(); render();
      });
      const paidCb = card.querySelector('[data-paid]');
      if (paidCb) paidCb.addEventListener('change', () => { payOf().paid = paidCb.checked; save(); render(); });
      // 翌月へスライド（カードの支払い月ズレ用）
      const slide = card.querySelector('[data-slide]');
      if (slide) slide.addEventListener('click', () => {
        const { ev } = resolve(card);
        const nextKey = shiftKey(currentKey, 1);
        const [ny, nm] = nextKey.split('-').map(Number);
        if (!confirm(`「${ev.name}」を ${ny}年${nm}月 に移しますか？`)) return;
        const md = monthData(currentKey), nd = monthData(nextKey);
        if (card.dataset.card.startsWith('cost:')) {
          md.costs = md.costs.filter(c => c !== ev);
          (md.removedCosts = md.removedCosts || []).push(ev.id);
          nd.costs = nd.costs.filter(c => c.id !== ev.id);
          nd.costs.push({ ...ev, id: uid(), name: ev.name + '（' + m0(currentKey) + '月分）', edited: true });
        } else {
          md.events = md.events.filter(e => e !== ev);
          nd.events.push(ev);
        }
        openCards.delete(id);
        save(); render();
      });
    });
  }

  // ---------- header ----------
  document.getElementById('prevMonth').onclick = () => { currentKey = shiftKey(currentKey, -1); render(); };
  document.getElementById('nextMonth').onclick = () => { currentKey = shiftKey(currentKey, 1); render(); };
  document.getElementById('todayBtn').onclick = () => { currentKey = monthKeyOf(new Date()); render(); };
  document.getElementById('confirmMonth').addEventListener('change', e => { monthData(currentKey).confirmed = e.target.checked; save(); render(); });

  // ---------- settings modal ----------
  const settingsModal = document.getElementById('settingsModal');
  document.getElementById('settingsBtn').onclick = () => {
    document.getElementById('fixedBudgetInputs').innerHTML = FIXED.map(f =>
      `<label><span>${f}</span><input type="number" min="0" data-fixed="${f}" value="${Number(state.fixedBudgets[f]) || 0}"></label>`).join('');
    renderCostInputs(state.fixedCosts || []);
    document.getElementById('exportArea').value = '';
    settingsModal.classList.add('show');
  };
  function renderCostInputs(costs) {
    const monthOpts = sel => Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${Number(sel) === i + 1 ? 'selected' : ''}>${i + 1}月</option>`).join('');
    document.getElementById('fixedCostInputs').innerHTML = costs.map(c =>
      `<label class="cost" data-cost-id="${esc(c.id)}" data-cycle="${c.cycle === 'year' ? 'year' : 'month'}">
        <input type="text" class="cname" placeholder="${c.cycle === 'year' ? '名前（例：年会費）' : '名前（例：家賃）'}" value="${esc(c.name)}">
        ${c.cycle === 'year' ? `<select class="cmonth">${monthOpts(c.month || 1)}</select>` : '<span class="cycle">毎月</span>'}
        <input type="number" class="camt" min="0" placeholder="金額" value="${Number(c.amount) || 0}">
        <button type="button" data-del-cost title="削除">×</button>
      </label>`).join('') || '<p class="hint">まだ登録がありません</p>';
    document.querySelectorAll('[data-del-cost]').forEach(b => b.onclick = () => {
      renderCostInputs(readCostInputs().filter(c => c.id !== b.closest('label').dataset.costId));
    });
  }
  function readCostInputs() {
    return [...document.querySelectorAll('#fixedCostInputs label.cost')].map(l => ({
      id: l.dataset.costId, name: l.querySelector('.cname').value.trim(), amount: Number(l.querySelector('.camt').value) || 0,
      cycle: l.dataset.cycle, month: l.querySelector('.cmonth') ? Number(l.querySelector('.cmonth').value) : undefined }));
  }
  const addCost = cycle => {
    renderCostInputs([...readCostInputs(), { id: uid(), name: '', amount: 0, cycle, month: m0(currentKey) }]);
    const last = document.querySelector('#fixedCostInputs label.cost:last-child .cname');
    if (last) last.focus();
  };
  document.getElementById('addCostBtn').onclick = () => addCost('month');
  document.getElementById('addYearCostBtn').onclick = () => addCost('year');
  document.getElementById('closeSettings').onclick = () => settingsModal.classList.remove('show');
  document.getElementById('saveSettings').onclick = () => {
    document.querySelectorAll('[data-fixed]').forEach(i => { state.fixedBudgets[i.dataset.fixed] = Number(i.value) || 0; });
    state.fixedCosts = readCostInputs().filter(c => c.name);
    // 今月以降の月にだけ反映する（過去の月はそのまま）
    const thisKey = monthKeyOf(new Date());
    Object.keys(state.months).forEach(k => { if (k >= thisKey) applySettingsTo(monthData(k), k); });
    monthData(thisKey);
    save(); render(); settingsModal.classList.remove('show');
  };
  document.getElementById('exportBtn').onclick = () => {
    const ta = document.getElementById('exportArea');
    ta.value = JSON.stringify(state); ta.select();
  };
  document.getElementById('importBtn').onclick = () => {
    try {
      const s = JSON.parse(document.getElementById('exportArea').value);
      if (!s || !s.months || !s.fixedBudgets) throw new Error();
      if (!confirm('現在のデータを上書きします。よろしいですか？')) return;
      state = s; save(); render(); settingsModal.classList.remove('show');
    } catch (e) { alert('読み込めませんでした。書き出したテキストをそのまま貼り付けてください。'); }
  };

  // ---------- event modal ----------
  const eventModal = document.getElementById('eventModal');
  document.getElementById('addEventBtn').onclick = () => {
    document.getElementById('evName').value = '';
    document.getElementById('evBudget').value = '';
    eventModal.classList.add('show');
    document.getElementById('evName').focus();
  };
  document.getElementById('closeEvent').onclick = () => eventModal.classList.remove('show');
  document.getElementById('saveEvent').onclick = addEvent;
  document.getElementById('evBudget').addEventListener('keydown', e => { if (e.key === 'Enter') addEvent(); });
  document.getElementById('evName').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('evBudget').focus(); });
  function addEvent() {
    const name = document.getElementById('evName').value.trim();
    const budget = Number(document.getElementById('evBudget').value) || 0;
    if (!name) { document.getElementById('evName').focus(); return; }
    const id = uid();
    monthData(currentKey).events.push({ id, name, budget, items: [] });
    openCards.add('event:' + id);
    save(); render(); eventModal.classList.remove('show');
  }

  [settingsModal, eventModal].forEach(mb => mb.addEventListener('click', e => { if (e.target === mb) mb.classList.remove('show'); }));

  render();
})();
</script>
</body>
</html>
